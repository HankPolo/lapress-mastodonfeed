name: RSS to Mastodon

on:
  schedule:
    - cron: "*/15 * * * *"   # UTC, every 15 min
  workflow_dispatch:          # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: rss-mastodon
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet feedparser requests

      - name: Run bot
        env:
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          FEED_URL: https://lapublicpress.org/feed/
        run: python bot.py

      - name: Save state
        if: always()
        run: |
          git config user.name  "rss-bot"
          git config user.email "actions@github.com"
          git add seen.json
          git diff --staged --quiet || git commit -m "update seen state"
          git push
