name: RSS to Mastodon

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rss-mastodon
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet feedparser requests

      - name: Check secrets
        env:
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
        run: |
          if [ -z "$MASTODON_INSTANCE" ]; then echo "INSTANCE MISSING"; else echo "instance: $MASTODON_INSTANCE"; fi
          if [ -z "$MASTODON_TOKEN" ]; then echo "TOKEN MISSING"; else echo "token length: ${#MASTODON_TOKEN}"; fi

      - name: Run bot
        env:
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          FEED_URL: https://lapublicpress.org/feed/
        run: python bot.py

      - name: Save state
        if: always()
        run: |
          if [ ! -f seen.json ]; then
            echo "seen.json missing - bot.py did not complete; nothing to commit"
            exit 0
          fi
          git config user.name  "rss-bot"
          git config user.email "actions@github.com"
          git add seen.json
          git diff --staged --quiet || git commit -m "update seen state"
          git push
